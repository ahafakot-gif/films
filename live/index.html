*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}

.dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(229,56,59,.7);animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(229,56,59,0)}100%{box-shadow:0 0 0 0 rgba(229,56,59,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

<div class="top"><div class="brand">אליעזר הפקות</div><div class="live"><span class="dot"></span>שידור חי · LIVE</div></div>
<h1 id="ttl">שידור חי</h1>
<div class="player" id="pl"><div class="wait" id="wait"><span>השידור יתחיל בקרוב · Starting soon</span></div></div>
<div class="row">

<script>(function(){
var SB="https://ndelumxaknembkdulbfl.supabase.co", K="sb_publishable_3_Wzm-oFYf9VqwbTM1Ogaw_WH3ptFNU", cur=null;
function H(){return {'apikey':K,'Authorization':'Bearer '+K};}
function vid(u){if(!u)return null;var m=/(?:youtu\.be\/|[?&]v=|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/.exec(u);return m?m[1]:null;}
function show(row){
  var u=row&&row.url, id=vid(u);
  if(row&&row.title){document.getElementById('ttl').textContent=row.title;document.title=row.title+' | אליעזר הפקות';}
  var yt=document.getElementById('yt');
  if(u){yt.href=u;yt.hidden=false;}else{yt.hidden=true;}
  if(id===cur)return; cur=id;
  var pl=document.getElementById('pl'), f=pl.querySelector('iframe');
  if(f)f.remove();
  document.getElementById('wait').hidden=!!id;
  if(id){f=document.createElement('iframe');
    f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1';
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.title='שידור חי';
    pl.appendChild(f);}
}
function load(){fetch(SB+'/rest/v1/live_links?slug=eq.live&select=url,title',{headers:H(),cache:'no-store'})
  .then(function(r){return r.json();}).then(function(a){show(a&&a[0]);}).catch(function(){});}
load(); setInterval(load,30000);
try{if(!/[?&]nostat/.test(location.search))fetch(SB+'/rest/v1/events',{method:'POST',keepalive:true,headers:Object.assign(H(),{'Content-Type':'application/json','Prefer':'return=minimal'}),body:JSON.stringify({page:'live',kind:'open'})}).catch(function(){});}catch(e){}
document.getElementById('share').addEventListener('click',function(){
  var d={title:'שידור חי – אליעזר הפקות',url:location.href.split('?')[0]};
  if(navigator.share){navigator.share(d).catch(function(){});}
  else{location.href='https://wa.me/?text='+encodeURIComponent(d.title+' '+d.url);}
});
})();</script>
