/* Hallmark · custom (owner's approved black + gold) · RTL Hebrew first, RU/EN · signature: his own event photos, full bleed */
/* critique: real photos carry every screen; one gold accent; no eyebrows; logo shown once in the nav */
:root{
  color-scheme:dark;
  --ink:#0E0D0B; --surface:#17150F; --surface-2:#1F1C15; --line:#2B271E; --line-strong:#5A4E33; --field-edge:#7A6C4C;
  --gold:#D4AF63; --gold-2:#F0D79A; --on-gold:#1A1409;
  --text:#F3EEE3; --muted:#B3AB9A; --danger:#F09A8A;
  --gold-wash:rgba(212,175,99,.10); --gold-wash-2:rgba(212,175,99,.16);
  --shade:rgba(14,13,11,.72); --shade-soft:rgba(14,13,11,.45); --shadow:rgba(0,0,0,.5);
  --wa:#167A3E; --wa-ink:#F7FFF9;
  --display:"Frank Ruhl Libre","David",Georgia,serif;
  --body:"Heebo","Arial Hebrew",Arial,sans-serif;
  --r:12px; --max:1160px;
}
html[lang=ru],html[lang=en]{--display:"Playfair Display",Georgia,serif;--body:"Manrope","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:clip}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.65}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;overflow-wrap:break-word;min-width:0}
p{margin:0}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:16px}
@media (min-width:760px){.wrap{padding-inline:32px}}

/* nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.logo img{height:44px;width:auto}
.links{display:none;gap:24px;font-size:16px}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--gold-2)}
@media (min-width:900px){.links{display:flex}}
.nav-end{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);font:700 16px var(--body);text-decoration:none;cursor:pointer;transition:background-color .2s,transform .2s}
.btn:hover{background:var(--gold-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gold-2)}
.btn.ghost:hover{background:var(--gold-wash)}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
@media (max-width:520px){#navcta{display:none}}

.lang{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--gold-2);font:700 14px var(--body);cursor:pointer}
.lang-btn:hover{border-color:var(--gold)}
.lang-btn svg{width:20px;height:20px}
.lang-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:4px;display:grid;min-width:168px;z-index:40}
.lang-menu button{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--text);font:500 16px var(--body);cursor:pointer;text-align:start}
.lang-menu button:hover{background:var(--gold-wash)}
.lang-menu button[aria-checked=true]{color:var(--gold)}
.lang-menu button[aria-checked=true]::after{content:"✓"}

/* hero */
.hero{position:relative;min-height:min(88svh,760px);display:grid;align-items:end;isolation:isolate}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--ink) 4%,var(--shade) 38%,transparent 75%)}
.hero .wrap{width:100%;padding-block:48px}
.hero-text{display:grid;gap:16px;max-width:620px}
.hero h1{font-size:clamp(38px,6vw,68px);font-weight:900;color:var(--text)}
html[lang=ru] .hero h1,html[lang=en] .hero h1{font-weight:700}
.hero p{font-size:19px;color:var(--text);max-width:520px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}

section{padding-block:72px}
section+section{border-top:1px solid var(--line)}
.head{display:grid;gap:8px;margin-bottom:32px;max-width:640px}
.head h2{font-size:clamp(30px,4vw,44px)}
.head p{color:var(--muted)}

/* event cards */
.events{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.ev{position:relative;display:grid;align-content:end;min-height:340px;border-radius:var(--r);overflow:hidden;text-decoration:none;isolation:isolate;border:1px solid var(--line)}
.ev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.ev::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--ink) 8%,var(--shade-soft) 45%,transparent 75%)}
.ev:hover{border-color:var(--gold)}
.ev .in{padding:20px;display:grid;gap:4px}
.ev h3{font-size:28px;color:var(--gold-2)}
.ev p{font-size:15px;color:var(--text)}
.ev .more{font-size:15px;color:var(--gold);font-weight:500;margin-top:4px}
.ev.wide{grid-column:1/-1;min-height:420px}
@media (min-width:900px){.events{grid-template-columns:repeat(6,minmax(0,1fr))}.ev{grid-column:span 2}.ev.wide{grid-column:span 4}.ev.half{grid-column:span 3}}

/* photo mosaic */
.mosaic{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:160px;grid-auto-flow:dense}
@media (min-width:760px){.mosaic{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:220px;gap:12px}}
.tile{position:relative;padding:0;border:0;border-radius:10px;overflow:hidden;cursor:zoom-in;background:var(--surface-2)}
.tile img{width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.tile:hover img{opacity:.85}
.tile.tall{grid-row:span 2}
.tile.big{grid-row:span 2;grid-column:span 2}

/* film band */
.film{display:grid;gap:24px;align-items:center}
@media (min-width:860px){.film{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px}}
.poster{position:relative;display:block;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster .play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:2px solid var(--gold-2);display:grid;place-items:center;background:var(--shade-soft);transition:transform .2s}
.poster:hover .play{transform:scale(1.08)}
.poster .play::before{content:"";border-style:solid;border-width:13px 0 13px 21px;border-color:transparent transparent transparent var(--gold-2);margin-left:4px}
.film-text{display:grid;gap:16px}
.film-text h2{font-size:clamp(30px,4vw,44px)}
.film-text p{color:var(--muted)}

/* clips */
.clips{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.clip{display:grid;gap:12px;padding:0;border:0;background:transparent;color:var(--text);text-align:start;cursor:pointer;font:inherit}
.clip .pic{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.clip .pic img{width:100%;height:100%;object-fit:cover}
.clip .card-t{position:absolute;inset:0;display:grid;place-content:center;gap:4px;padding:16px;text-align:center;background:radial-gradient(circle at 50% 40%,var(--surface-2),var(--ink));font-family:var(--display);font-size:24px;line-height:1.2;color:var(--gold-2)}
.clip .card-t small{font-family:var(--body);font-size:14px;color:var(--muted)}
.clip:hover .pic{border-color:var(--gold)}
.clip .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;border:2px solid var(--gold-2);display:grid;place-items:center;background:var(--shade)}
.clip .play::before{content:"";border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent var(--gold-2);margin-left:4px}
.clip .name{font-size:16px;font-weight:500}
.clip.new .name{color:var(--gold-2)}
.film-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
dialog.vb{padding:0;border:0;background:transparent;width:min(1100px,100%);max-width:100%;max-height:100svh;margin:auto}
dialog.vb::backdrop{background:var(--shade)}
.vb-in{position:relative;display:grid;gap:12px;padding:56px 8px 16px}
.vb-in video{width:100%;max-height:78svh;border-radius:8px;background:var(--ink)}
.vb-in .lb-close{top:4px}
.vb-cap{color:var(--text);font-size:16px}
.vb-err{color:var(--muted);font-size:15px}
.vb-err a{color:var(--gold-2)}

/* client preview banner */
.mine{position:absolute;top:8px;inset-inline-start:8px;z-index:2;background:var(--gold);color:var(--on-gold);font:700 13px var(--body);padding:4px 12px;border-radius:20px;pointer-events:none}
.tile,.ev,.clip .pic{position:relative}
.tile.is-mine,.clip.is-mine .pic{outline:3px solid var(--gold);outline-offset:-3px}
.ask{position:fixed;inset-inline:0;bottom:0;z-index:45;background:var(--surface);border-top:2px solid var(--gold);padding-block:16px calc(16px + env(safe-area-inset-bottom,0px))}
.ask .wrap{display:grid;gap:12px}
.ask .wrap{position:relative;gap:8px}
.ask h3{font-size:22px;color:var(--gold-2);padding-inline-end:48px}
.ask p{color:var(--text);font-size:16px;max-width:760px}
.ask .actions{margin-top:4px}
#ask-hide{position:absolute;top:-4px;inset-inline-end:16px;min-width:44px;min-height:44px;padding:0;border-radius:50%}
@media (max-width:600px){
 .ask{padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
 .ask h3{font-size:19px}.ask p{font-size:14px;line-height:1.5}
 .ask .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .ask .actions .btn{min-height:44px;padding:0 8px;font-size:14px}
 #ask-yes{grid-column:1/-1}
 body.asking{padding-bottom:240px}
}
.ask-min{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;z-index:45}
body.asking{padding-bottom:260px}
body.asking .wa-float{display:none}

/* about */
.about{display:grid;gap:32px;align-items:center}
@media (min-width:860px){.about{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}}
.about-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.about-photos img{border-radius:10px;aspect-ratio:3/4;object-fit:cover;width:100%}
.about-photos img:last-child{margin-top:40px}
.about-text{display:grid;gap:16px}
.about-text h2{font-size:clamp(30px,4vw,44px)}
.about-text p{color:var(--muted)}
.facts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:12px}
.facts li{padding-inline-start:16px;border-inline-start:2px solid var(--gold)}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px;counter-reset:s}
.step{display:grid;gap:8px;align-content:start}
.step::before{counter-increment:s;content:counter(s);font:700 40px var(--display);color:var(--gold);line-height:1}
.step h3{font-size:22px}
.step p{color:var(--muted);font-size:16px}

/* contact */
.contact{display:grid;gap:40px;align-items:start}
@media (min-width:860px){.contact{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}}
.contact-side{display:grid;gap:16px}
.contact-side h2{font-size:clamp(30px,4vw,44px)}
.contact-side p{color:var(--muted)}
.phone-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phone{font:700 28px var(--body);direction:ltr;unicode-bidi:isolate;text-decoration:none;color:var(--gold-2)}
.channels{display:flex;flex-wrap:wrap;gap:8px}
form,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
label{display:grid;gap:8px;font-size:15px;color:var(--muted)}
input,select,textarea{width:100%;min-height:48px;background:var(--ink);border:1px solid var(--field-edge);border-radius:10px;color:var(--text);font:16px var(--body);padding:12px 16px}
input:hover,select:hover,textarea:hover{border-color:var(--gold)}
textarea{min-height:96px;resize:vertical}
.err{color:var(--danger);font-size:15px;min-height:1em}
.done{border:1px solid var(--gold);border-radius:10px;padding:16px;display:grid;gap:12px}
.done a{color:var(--gold-2)}
.hint{font-size:15px;color:var(--muted)}
.toast{position:fixed;inset-inline:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:16px;z-index:50;font-size:15px}

/* event page */
.ev-hero{position:relative;min-height:min(64svh,560px);display:grid;align-items:end;isolation:isolate}
.ev-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.ev-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--ink) 4%,var(--shade) 40%,transparent 80%)}
.ev-hero .wrap{width:100%;padding-block:32px;display:grid;gap:12px}
.ev-hero h1{font-size:clamp(40px,6vw,68px);font-weight:900}
html[lang=ru] .ev-hero h1,html[lang=en] .ev-hero h1{font-weight:700}
.ev-hero p{max-width:560px;font-size:18px}
.back{justify-self:start;display:inline-flex;align-items:center;min-height:44px;color:var(--gold-2);text-decoration:none;font-size:16px}
.back:hover{text-decoration:underline}

.builder{display:grid;gap:32px;align-items:start}
@media (min-width:900px){.builder{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.groups{display:grid;gap:28px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0}
legend{font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:4px;padding:0}
legend small{display:block;font-family:var(--body);font-size:15px;font-weight:400;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;color:var(--text);font-size:16px;transition:border-color .15s,background-color .15s}
.opt:hover{border-color:var(--line-strong)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.opt:focus-within{outline:2px solid var(--gold-2);outline-offset:2px}
.opt .box{flex:none;width:22px;height:22px;margin-top:2px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
.opt input[type=radio]+.box{border-radius:50%}
.opt .t{display:grid;gap:4px}
.opt .t small{color:var(--muted);font-size:14px;line-height:1.45}
.opt:has(input:checked){border-color:var(--gold);background:var(--gold-wash)}
.opt input:checked+.box{border-color:var(--gold);background:var(--gold)}
.opt input:checked+.box::after{content:"";width:6px;height:11px;border:solid var(--on-gold);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt input[type=radio]:checked+.box::after{width:8px;height:8px;border:0;border-radius:50%;background:var(--on-gold);transform:none}
.summary{position:sticky;top:88px}
.summary h3{font-size:24px}
.summary ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.summary li{font-size:15px;line-height:1.45;padding-inline-start:12px;border-inline-start:2px solid var(--gold)}
.summary li b{font-weight:500;color:var(--muted)}
.hr{height:1px;background:var(--line)}

/* lightbox */
dialog.lb{padding:0;border:0;background:transparent;max-width:100vw;max-height:100svh;width:100%;height:100%;margin:0}
dialog.lb::backdrop{background:var(--shade)}
.lb-in{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:56px 8px}
.lb-in img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-btn{display:grid;place-items:center;position:absolute;min-width:48px;min-height:48px;border-radius:50%;border:1px solid var(--gold);background:var(--surface);color:var(--gold-2);font:700 22px var(--body);cursor:pointer}
.lb-btn:hover{background:var(--surface-2)}
.lb-close{top:8px;inset-inline-end:8px}
.lb-prev{inset-inline-start:8px;top:50%;transform:translateY(-50%)}
.lb-next{inset-inline-end:8px;top:50%;transform:translateY(-50%)}

.wa-float{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--wa);color:var(--wa-ink);display:grid;place-items:center;z-index:20;transition:transform .2s}
html[dir=ltr] .wa-float{left:auto;right:16px}
html[dir=ltr] .chev{transform:scaleX(-1)}
.wa-float:hover{transform:scale(1.06)}
footer{border-top:1px solid var(--line);padding-block:40px 112px;color:var(--muted);font-size:15px}
.foot{display:grid;gap:24px}
@media (min-width:760px){.foot{grid-template-columns:auto minmax(0,1fr) auto;align-items:center}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* language */
let lang='he',current=null,showAll=false;
const $=id=>document.getElementById(id);
const t=k=>T[lang][k];
function applyLang(l){
  lang=l;const d=T[l];
  document.documentElement.lang=l;document.documentElement.dir=d.dir;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=d[el.dataset.t]);
  document.querySelectorAll('[data-t-ph]').forEach(el=>el.placeholder=d[el.dataset.tPh]);
  document.querySelectorAll('[data-t-alt]').forEach(el=>el.alt=d[el.dataset.tAlt]);
  document.querySelectorAll('[data-t-aria]').forEach(el=>el.setAttribute('aria-label',d[el.dataset.tAria]));
  $('langCode').textContent=d.code;
  document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-checked',b.dataset.lang===l));
  document.title=l==='he'?'אליעזר הפקות | צילום אירועים':l==='ru'?'Элиэзер Афакот | фото и видео мероприятий':'Eliezer Hafakot | Event Photography';
  try{localStorage.setItem('lang',l)}catch(_){}
  $('done').hidden=true;$('ev-done').hidden=true;$('err').textContent='';$('ev-err').textContent='';
  fillClips($('clips'),showAll?CLIPS:CLIPS.slice(0,6));$('more-clips').hidden=showAll||CLIPS.length<=6;$('more-clips').textContent=t('more_clips')+' ('+CLIPS.length+')';
  if(current) renderEvent(current,true);
  if(typeof renderAsk==='function'&&CK){renderAsk();fillMosaic($('mosaic'),MOSAIC)}
}
const closeLang=()=>{$('langMenu').hidden=true;$('langBtn').setAttribute('aria-expanded','false')};
$('langBtn').addEventListener('click',e=>{e.stopPropagation();const m=$('langMenu');m.hidden=!m.hidden;$('langBtn').setAttribute('aria-expanded',!m.hidden)});
$('langMenu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;applyLang(b.dataset.lang);closeLang()});

    else{const ct=document.createElement('span');ct.className='card-t';ct.textContent=c.t[lang].split(/[,:]/).pop().trim();
      const sm=document.createElement('small');sm.textContent=c.cat==='new'?t('new_card'):c.t[lang].split(/[,:]/)[0];ct.appendChild(sm);pic.appendChild(ct)}

/* event page */
function renderBuilder(key,keep){
  const box=$('groups');
  const was=keep?[...box.querySelectorAll('input')].map(i=>[i.id,i.checked]):null;
  box.innerHTML='';
  EVENTS[key].groups.forEach(gr=>{
    const fs=document.createElement('fieldset');
    fs.innerHTML=`<legend>${gr.label[lang]}${gr.hint?`<small>${gr.hint[lang]}</small>`:''}</legend>`;
    const opts=document.createElement('div');opts.className='opts';
    gr.opts.forEach(([name,sub],i)=>{
      const id=`${key}-${gr.id}-${i}`,l=document.createElement('label');l.className='opt';l.htmlFor=id;
      l.innerHTML=`<input id="${id}" type="${gr.type==='radio'?'radio':'checkbox'}" name="${key}-${gr.id}" data-i="${i}" ${gr.type==='radio'&&i===0?'checked':''}><span class="box"></span><span class="t">${name[lang]}${sub?`<small>${sub[lang]}</small>`:''}</span>`;
      opts.appendChild(l);
    });
    fs.appendChild(opts);box.appendChild(fs);
  });
  if(was) was.forEach(([id,c])=>{const el=$(id);if(el)el.checked=c});
  box.onchange=()=>{updateSummary();$('ev-done').hidden=true};updateSummary();
}
function choices(){
  return EVENTS[current].groups.map(gr=>{
    const vals=[...document.querySelectorAll(`input[name="${current}-${gr.id}"]:checked`)]
      .filter(i=>!(gr.none===0&&i.dataset.i==='0'))
      .map(i=>gr.opts[+i.dataset.i][0][lang]);
    return vals.length?[gr.label[lang],vals.join(', ')]:null;
  }).filter(Boolean);
}
function updateSummary(){
  $('sum').innerHTML='';
  choices().forEach(([l,v])=>{const li=document.createElement('li'),b=document.createElement('b');b.textContent=l+': ';li.append(b,v);$('sum').appendChild(li)});
}
function renderEvent(key,keep){
  const ev=EVENTS[key];
  $('ev-img').src='img/'+ev.img+'.jpg';
  $('ev-title').textContent=ev.title[lang];$('ev-intro').textContent=ev.intro[lang];
  const n=ev.gallery.length,gap=(4-((3+n)%4))%4;
  fillMosaic($('gallery'),ev.gallery.map((s,i)=>[s,i===0?'big':(i<=gap?'tall':'')]));
  const cl=CLIPS.filter(c=>c.cat===key);$('ev-films').hidden=!cl.length;fillClips($('ev-clips'),cl);
  renderBuilder(key,keep);
}
function fmtDate(v){return v?v.split('-').reverse().join('/'):t('m_nodate')}
function validate(nameId,telId,errId){
  const n=$(nameId).value.trim(),p=$(telId).value.trim(),err=$(errId);
  if(!n){err.textContent=t('err_name');$(nameId).focus();return null}
  if(p.replace(/\D/g,'').length<9){err.textContent=t('err_tel');$(telId).focus();return null}
  err.textContent='';return {n,p};
}
$('ev-send').addEventListener('click',()=>{

  const text=`${t('m_hi')(v.n)}\n${t('m_event')}: ${EVENTS[current].tag[lang]}\n${t('m_date')}: ${fmtDate($('ev-date').value)}`+(place?`\n${t('m_place')}: ${place}`:'')+`\n${t('m_tel')}: ${v.p}\n\n${t('m_pack')}:\n${lines}`;
  $('ev-wa').href=`https://wa.me/${PHONE}?text=${encodeURIComponent(text)}`;$('ev-done').hidden=false;
});

  }catch(_){try{navigator.clipboard.writeText('0506611106')}catch(__){}toast(t('toast_copy'))}
});

  if(CK){const q=new URLSearchParams(location.search);l=(q.get('lang')&&T[q.get('lang')])?q.get('lang'):'he';if((CLIENTS[CK].clips||[]).some(id=>CLIENTS&&CLIPS.findIndex(c=>c.id===id)>=6))showAll=true;}
  applyLang(l);fillMosaic($('mosaic'),MOSAIC);route();if(CK){renderAsk();setAsk(true)}
