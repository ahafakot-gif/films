name: Bedek Mac app

on:
  push:
    paths:
      - 'mac-app/Bedek/**'
      - '.github/workflows/bedek-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mac-app
            .github

      - name: Build app and DMG
        run: ./mac-app/Bedek/build.sh

      - name: Smoke test (app starts)
        run: |
          APP=mac-app/Bedek/dist/Bedek.app/Contents/MacOS/Bedek
          "$APP" & PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "App is running"; kill $PID; else echo "App exited early"; wait $PID; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Bedek-${{ env.VERSION }}
          path: mac-app/Bedek/dist/Bedek-${{ env.VERSION }}.dmg

      - name: Publish download (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "bedek-v$VERSION" "mac-app/Bedek/dist/Bedek-$VERSION.dmg" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Bedek $VERSION (Mac)" \
            --notes "Bedek — уход за Mac. Скачайте .dmg, перетащите Bedek в «Программы». Первый запуск: правый клик → Открыть."
