<!doctype html>
<html lang="he" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אליעזר הפקות · Watch &amp; Download</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="צפייה והורדה · Watch &amp; Download">
<meta property="og:type" content="website">
<meta property="og:site_name" content="אליעזר הפקות">
<meta property="og:title" content="אליעזר הפקות · צפייה והורדה">
<meta property="og:description" content="Watch &amp; Download">
<meta property="og:image" content="https://ahafakot-gif.github.io/films/cover-default.jpg">
<meta property="og:image:secure_url" content="https://ahafakot-gif.github.io/films/cover-default.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#100e0a;--panel:#1a1711;--fg:#f3eee3;--muted:#a79f8c;--line:#2e2a20;--gold:#d6ad55;--gold-ink:#17120a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.brand{color:var(--gold);font-weight:600;letter-spacing:.02em;font-size:15px}
h1{margin:0;font-size:clamp(22px,4.5vw,34px);font-weight:700;text-wrap:balance}
h2{margin:0;font-size:clamp(18px,3.6vw,24px);font-weight:600;overflow-wrap:anywhere}
.item{display:flex;flex-direction:column;gap:12px}
.item+.item{border-top:1px solid var(--line);padding-top:22px}
video{width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;
 font:inherit;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:var(--panel)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.photos{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.photos .ic{width:56px;height:56px;border-radius:12px;background:var(--gold);display:grid;place-items:center}
.muted{color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">אליעזר הפקות</div>
  <h1 id="title" dir="auto">צפייה והורדה · Watch &amp; Download</h1>
  <div id="items"></div>
  <footer><span>אליעזר הפקות · Eliezer Productions</span><span dir="ltr">+972-50-6611106</span></footer>
</div>
<script>
(function(){
  function decode(s){
    try{
      s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
      var bin=atob(s), bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    }catch(e){ return null; }
  }
  var okPath=/^\/(scl\/fi|scl\/fo|s|sh)\/[^?#\s]+$/;
  function clean(it){
    if(!it||typeof it.p!=='string'||!okPath.test(it.p)||it.p.indexOf('//')>=0) return null;
    var r=(typeof it.r==='string'&&/^[A-Za-z0-9_-]{1,80}$/.test(it.r))?it.r:'';
    return {n:String(it.n||'').slice(0,160), t:it.t==='f'?'f':'v', p:it.p, r:r};
  }
  var params=new URLSearchParams(location.search);
  var data=decode(params.get('d')||'');
  var list=(data&&Array.isArray(data.i)?data.i:[]).map(clean).filter(Boolean).slice(0,40);
  var box=document.getElementById('items');
  if(data&&typeof data.h==='string'&&data.h) {document.getElementById('title').textContent=data.h.slice(0,160);}
  else if(list.length===1&&list[0].n){document.getElementById('title').textContent=list[0].n;}
  if(document.getElementById('title').textContent) document.title=document.getElementById('title').textContent+' | אליעזר הפקות';
  if(!list.length){ var m=document.createElement('p'); m.className='muted'; m.textContent='הקישור לא תקין · This link is not valid'; box.appendChild(m); return; }
  function el(tag,cls,text){var e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e;}
  list.forEach(function(it){
    var q=it.r?('?rlkey='+encodeURIComponent(it.r)):'';
    var dl='https://www.dropbox.com'+it.p+(q?q+'&dl=1':'?dl=1');
    var wrap=el('div','item');
    if(list.length>1&&it.n){ var h=el('h2',null,it.n); h.dir='auto'; wrap.appendChild(h); }
    if(it.t==='v'){
      var v=document.createElement('video'); v.controls=true; v.playsInline=true; v.preload='metadata';
      v.src='https://dl.dropboxusercontent.com'+it.p+q; wrap.appendChild(v);
      var row=el('div','row');
      var a=el('a','btn gold','⬇ הורדה · Download'); a.href=dl; row.appendChild(a);
      var fs=el('button','btn','⛶ מסך מלא · Full screen'); fs.type='button';
      fs.addEventListener('click',function(){ var p=v.play(); if(p&&p.catch)p.catch(function(){});
        if(v.requestFullscreen) v.requestFullscreen().catch(function(){ if(v.webkitEnterFullscreen) v.webkitEnterFullscreen(); });
        else if(v.webkitEnterFullscreen) v.webkitEnterFullscreen(); else if(v.webkitRequestFullscreen) v.webkitRequestFullscreen(); });
      row.appendChild(fs); wrap.appendChild(row);
    } else {
      var ph=el('div','photos');
      var ic=el('div','ic'); ic.innerHTML='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#17120a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-5-8 8"/></svg>';
      ph.appendChild(ic);
      ph.appendChild(el('div',null,'קבצים · Files'));
      var row2=el('div','row');
      var view=el('a','btn gold','👁 לצפייה · View'); view.href='https://www.dropbox.com'+it.p+(q?q+'&dl=0':'?dl=0'); view.target='_blank'; view.rel='noopener';
      var all=el('a','btn','⬇ להורדת הכל · Download all'); all.href=dl;
      row2.appendChild(view); row2.appendChild(all); ph.appendChild(row2);
      wrap.appendChild(ph);
    }
    box.appendChild(wrap);
  });
})();
</script>
</body>
</html>
